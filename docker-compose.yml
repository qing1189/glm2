services:
  glm2api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glm-2api
    restart: unless-stopped
    ports:
      - "3003:3003"
    # Chrome 需要较大的共享内存
    shm_size: '1gb'
    env_file:
      - .env.docker
    environment:
      - CHROME_PATH=/usr/bin/google-chrome-stable
      - USER_DATA_DIR=/app/edge-profile
      - GLM_SERVER_MODE=1
    volumes:
      # 持久化 Chrome 用户数据 + Token 配置（登录状态、cookies、面板配置等）
      - chrome-data:/app/edge-profile
      # 挂载环境变量文件，确保 dotenv 能读取
      - ./.env.docker:/app/.env.docker:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  chrome-data:
    driver: local
