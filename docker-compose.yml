version: '3.8'

services:
  glm2api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glm-2api
    restart: unless-stopped
    ports:
      - "${PORT:-3003}:${PORT:-3003}"
    # Chrome 需要较大的共享内存
    shm_size: '1gb'
    environment:
      - GLM_TOKENS=${GLM_TOKENS:-}
      - GLM_ACCOUNTS=${GLM_ACCOUNTS:-}
      - PORT=${PORT:-3003}
      - API_KEY=${API_KEY:-}
      - CHROME_PATH=/usr/bin/google-chrome-stable
      - USER_DATA_DIR=/app/edge-profile
      - GLM_SERVER_MODE=1
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - DEBUG_SSE=${DEBUG_SSE:-0}
    volumes:
      # 持久化 Chrome 用户数据（登录状态、cookies 等）
      - chrome-data:/app/edge-profile
    env_file:
      - .env.docker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3003}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  chrome-data:
    driver: local
